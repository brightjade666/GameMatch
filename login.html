<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        /* 背景：同款樱花城市夜景 */
        body {
            background: url('https://picsum.photos/id/1039/1920/1080') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 背景渐变遮罩，统一色调 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
            z-index: 0;
        }

        /* 毛玻璃登录卡片 */
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 标题 */
        .title {
            text-align: center;
            color: white;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        /* 输入框组 */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 18px 20px 18px 50px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            font-size: 15px;
            color: #333;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            background: white;
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        /* 输入框图标 */
        .input-group .icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #666;
        }

        /* 记住我+忘记密码行 */
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0 30px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .remember input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot {
            color: white;
            font-size: 14px;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .forgot:hover {
            opacity: 0.8;
        }

        /* 登录按钮 */
        .login-btn {
            width: 100%;
            padding: 16px;
            background: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        /* 注册入口 */
        .register-link {
            text-align: center;
            margin-top: 30px;
            color: white;
            font-size: 15px;
        }

        .register-link a {
            color: white;
            font-weight: 600;
            text-decoration: none;
            margin-left: 5px;
            transition: opacity 0.3s;
        }

        .register-link a:hover {
            opacity: 0.8;
        }

        /* 提示消息 */
        .message {
            margin: 15px 0;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            display: none;
            font-size: 14px;
        }

        .success {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border: 1px solid rgba(76, 175, 80, 0.3);
            display: block;
        }

        .error {
            background: rgba(244, 67, 54, 0.2);
            color: #F44336;
            border: 1px solid rgba(244, 67, 54, 0.3);
            display: block;
        }

        /* 注册表单（默认隐藏） */
        #register-form {
            display: none;
        }

        #register-form.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 返回登录链接 */
        .back-login {
            text-align: center;
            margin-top: 20px;
            color: white;
            font-size: 14px;
        }

        .back-login a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 提示消息 -->
        <div id="message" class="message"></div>

        <!-- 登录表单 -->
        <div id="login-form">
            <h1 class="title">WELCOME</h1>

            <div class="input-group">
                <span class="icon">👤</span>
                <input type="text" id="login-name" placeholder="请输入昵称">
            </div>

            <div class="input-group">
                <span class="icon">🔒</span>
                <input type="password" id="login-pwd" placeholder="请输入密码">
            </div>

            <div class="row">
                <label class="remember">
                    <input type="checkbox" id="remember-me">
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot">Forgot password?</a>
            </div>

            <button class="login-btn" onclick="login()">Login</button>

            <div class="register-link">
                Don't have an account? <a href="javascript:switchTab('register')">Register</a>
            </div>
        </div>

        <!-- 注册表单 -->
        <div id="register-form">
            <h1 class="title">REGISTER</h1>

            <div class="input-group">
                <span class="icon">👤</span>
                <input type="text" id="register-name" placeholder="设置昵称">
            </div>

            <div class="input-group">
                <span class="icon">🔒</span>
                <input type="password" id="register-pwd" placeholder="设置密码">
            </div>

            <button class="login-btn" onclick="register()">Register</button>

            <div class="back-login">
                Already have an account? <a href="javascript:switchTab('login')">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        // 切换登录/注册表单
        function switchTab(type) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const message = document.getElementById('message');

            if (type === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }
            message.className = 'message';
        }

        // 提示消息
        function showMessage(text, isSuccess) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + (isSuccess ? 'success' : 'error');
        }

        // 生成令牌
        function generateToken() {
            return 'TOKEN_' + Math.random().toString(36).substr(2) + Date.now();
        }

        // Mock数据库
        let mockDB = {
            "users": [
                { "id": 1, "nickname": "admin", "password": "123456", "createTime": "2026-04-01 10:00:00" },
                { "id": 2, "nickname": "test", "password": "123456", "createTime": "2026-04-01 10:05:00" }
            ]
        };

        // 页面加载
        window.onload = function () {
            if (localStorage.getItem('userLogin')) {
                location.href = 'index.html';
            }
        };

        // 注册
        function register() {
            const name = document.getElementById('register-name').value.trim();
            const pwd = document.getElementById('register-pwd').value.trim();

            if (!name || !pwd) {
                showMessage('昵称和密码不能为空', false);
                return;
            }

            let localData = JSON.parse(localStorage.getItem('mockDB')) || mockDB;
            const exist = localData.users.find(u => u.nickname === name);

            if (exist) {
                showMessage('该昵称已被注册', false);
                return;
            }

            const newUser = {
                id: localData.users.length + 1,
                nickname: name,
                password: pwd,
                createTime: new Date().toLocaleString()
            };
            localData.users.push(newUser);
            localStorage.setItem('mockDB', JSON.stringify(localData));

            showMessage('注册成功！请登录', true);
            switchTab('login');
        }

        // 登录
        function login() {
            const name = document.getElementById('login-name').value.trim();
            const pwd = document.getElementById('login-pwd').value.trim();
            const remember = document.getElementById('remember-me').checked;

            if (!name || !pwd) {
                showMessage('请输入昵称和密码', false);
                return;
            }

            let localData = JSON.parse(localStorage.getItem('mockDB')) || mockDB;
            const user = localData.users.find(u => u.nickname === name);

            if (!user || user.password !== pwd) {
                showMessage('昵称或密码错误', false);
                return;
            }

            const token = generateToken();
            const userInfo = {
                nickname: user.nickname,
                token: token,
                loginTime: new Date().toLocaleString()
            };
            localStorage.setItem('userLogin', JSON.stringify(userInfo));

            showMessage('登录成功，正在跳转...', true);

            setTimeout(() => {
                location.href = 'index.html';
            }, 1000);
        }
    </script>
</body>
</html>
