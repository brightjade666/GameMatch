<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>组队社区</title>
    <link rel="stylesheet" href="stylesheets/style.css">
    <style>
        :root {
            --primary: #0078d4;
            --success: #28a745;
            --danger: #dc3545;
        }

        .tab-btn {
            padding: 8px 16px;
            border: none;
            background: #f1f1f1;
            cursor: pointer;
        }

        .active-tab {
            background: var(--primary);
            color: white;
        }

        .team-card {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .member-item {
            padding: 6px 0;
            font-size: 14px;
            color: #555;
        }

        #nav-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            vertical-align: middle;
            margin-right: 8px;
        }

        /* 全局确认弹窗 */
        #globalConfirmModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

            #globalConfirmModal.active {
                display: flex;
            }

        .confirm-box {
            background: white;
            border-radius: 14px;
            padding: 25px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            min-width: 300px;
        }

            .confirm-box p {
                margin: 15px 0 25px;
                font-size: 15px;
                color: #333;
            }

        .confirm-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .confirm-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .confirm-btn-primary {
            background: #dc3545;
            color: white;
        }

        .confirm-btn-default {
            background: #ddd;
            color: #333;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-links">
            <span onclick="switchP('home')" id="n-home" class="active">主页</span>
            <span onclick="switchP('profile')" id="n-profile">我的</span>
        </div>
        <div class="user-info-nav" onclick="switchP('profile')">
            <img id="nav-avatar" src="https://ui-avatars.com/api/?name=用户">
            <span id="nav-nick">...</span>
        </div>
    </header>

    <div class="container">
        <section id="p-home">
            <div class="grid" id="home-list"></div>
        </section>

        <section id="p-profile" style="display:none;">
            <div class="user-display-card" style="display: flex; background: #fff; padding: 25px; border-radius: 15px; gap: 30px; margin-bottom: 20px;">
                <div style="flex: 1;">
                    <div style="position: relative; display: inline-block;">
                        <img id="info-avatar" src="https://ui-avatars.com/api/?name=用户" style="width:120px; height:120px; border-radius:15px; object-fit: cover;">
                        <div id="status-tag" style="display:none; position: absolute; top:0; left:0; background:red; color:#fff; font-size:12px; padding:2px 8px; border-radius:15px 0 15px 0;">已禁用</div>
                    </div>
                    <h2 id="info-nick" style="margin:10px 0 5px 0;"></h2>
                    <p id="info-bio" style="font-size:13px; color:#666; margin:0; line-height:1.4;"></p>
                </div>
                <div style="flex: 1; border-left: 1px solid #eee; padding-left: 30px; display: flex; flex-direction: column; justify-content: space-between;">
                    <div>
                        <p style="margin: 5px 0;"><strong>用户 ID:</strong> <span id="info-uid" style="color:var(--primary)"></span></p>
                        <p style="margin: 5px 0;"><strong>更新时间:</strong> <span id="info-utime" style="font-size:13px; color:#999;"></span></p>
                    </div>
                    <div style="display:flex; gap:10px; margin-top: 15px;">
                        <button class="btn-s" style="background:var(--primary); flex:1;" onclick="goToIfLogin('user.html')">编辑资料</button>
                        <button class="btn-s" style="background:var(--success); flex:1;" onclick="goToIfLogin('create-team.html')">发起组队</button>
                        <button class="btn-s" style="background:#6a1b9a; flex:1; color:white;" onclick="goToIfLogin('match.html')">匹配队友</button>
                        <button class="btn-s" style="background:var(--danger); flex:1;" onclick="logout()">退出登录</button>
                    </div>
                </div>
            </div>

            <div style="background:#fff; padding:20px; border-radius:15px;">
                <div style="display:flex; margin-bottom:15px;">
                    <button id="t-teams" class="tab-btn" onclick="switchTab('teams')">我的队伍</button>
                    <button id="t-msgs" class="tab-btn" onclick="switchTab('msgs')">我的消息</button>
                </div>
                <div id="tab-content"></div>
            </div>
        </section>
    </div>

    <div id="detail-modal" class="modal-overlay" onclick="closeDetail(event)">
        <div class="modal" id="detail-content" style="max-width:600px;"></div>
    </div>

    <!-- 全局确认弹窗 -->
    <div id="globalConfirmModal">
        <div class="confirm-box">
            <p id="globalConfirmMsg"></p>
            <div class="confirm-buttons">
                <button class="confirm-btn confirm-btn-default" onclick="closeGlobalConfirm()">取消</button>
                <button class="confirm-btn confirm-btn-primary" id="globalConfirmOk">确定</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
