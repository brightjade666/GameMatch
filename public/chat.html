<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>游戏开黑聊天系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI','Microsoft YaHei',sans-serif;
        }

        body {
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .chat-list {
            width: 280px;
            background: #fff;
            border-right: 1px solid #e5e6eb;
            display: flex;
            flex-direction: column;
        }

        .chat-list-header {
            padding: 15px 20px;
            font-size: 18px;
            font-weight: 600;
            border-bottom: 1px solid #e5e6eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            padding: 6px 12px;
            background: #0078d7;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
        }

        .session-item {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f2f5;
            cursor: pointer;
            display: flex;
            gap: 12px;
        }

            .session-item.active {
                background: #e5e6eb;
            }

        .session-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #0078d7;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            background-size: cover;
        }

        .session-info {
            flex: 1;
            overflow: hidden;
        }

        .session-nickname {
            font-size: 16px;
            font-weight: 500;
            color: #1d2129;
        }

        .session-last-msg {
            font-size: 14px;
            color: #86909c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f7f8fa;
        }

        .chat-header {
            padding: 12px 20px;
            background: #fff;
            border-bottom: 1px solid #e5e6eb;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #0078d7;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            background-size: cover;
        }

        .chat-header-name {
            font-size: 16px;
            font-weight: 500;
            color: #1d2129;
        }

        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            max-width: 70%;
            margin-bottom: 12px;
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s;
        }

            .message.self {
                align-self: flex-end;
                flex-direction: row-reverse;
                margin-left: auto;
            }

            .message.other {
                align-self: flex-start;
            }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #86909c;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            background-size: cover;
            flex-shrink: 0;
        }

        .message-content-wrap {
            display: flex;
            flex-direction: column;
        }

        .message-sender {
            font-size: 12px;
            color: #86909c;
            margin-bottom: 4px;
        }

        .message.self .message-sender {
            text-align: right;
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            word-break: break-word;
        }

        .message.self .message-bubble {
            background: #0078d7;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.other .message-bubble {
            background: #fff;
            color: #1d2129;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .message img,
        .message video {
            max-width: 220px;
            border-radius: 8px;
            display: block;
        }

        .input-toolbar {
            display: flex;
            gap: 15px;
            padding: 8px 20px;
            background: #fff;
            border-top: 1px solid #e5e6eb;
        }

        .tool-btn {
            font-size: 18px;
            cursor: pointer;
            color: #666;
        }

        .input-area {
            padding: 15px 20px;
            background: #fff;
            display: flex;
            gap: 10px;
            border-top: 1px solid #e5e6eb;
        }

        #message-input {
            flex: 1;
            padding: 12px 18px;
            background: #f0f2f5;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            resize: none;
            height: 45px;
        }

        #send-btn {
            padding: 12px 25px;
            background: #0078d7;
            border: none;
            border-radius: 25px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        .member-list {
            width: 240px;
            background: #fff;
            border-left: 1px solid #e5e6eb;
            display: flex;
            flex-direction: column;
        }

        .member-list-header {
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid #e5e6eb;
        }

        .member-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .member-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            padding: 8px;
            border-bottom: 1px solid #f0f2f5;
        }

        .member-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            color: #fff;
            white-space: nowrap;
        }

        .badge-leader {
            background: #f0ad4e;
        }

        .member-btn {
            border: none;
            border-radius: 4px;
            padding: 3px 10px;
            font-size: 12px;
            cursor: pointer;
            color: #fff;
            white-space: nowrap;
        }

        .member-btn-primary {
            background: #0078d7;
        }

        .member-btn-danger {
            background: #dc3545;
        }

        .member-btn-info {
            background: #6c757d;
        }

        .member-item-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .member-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #0078d7;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            flex-shrink: 0;
        }

        .member-name-wrap {
            display: flex;
            flex-direction: column;
        }

        .member-top {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .member-name {
            font-weight: 500;
            font-size: 14px;
            color: #1d2129;
        }

        .leader-tag {
            display: inline-block;
            background: #f0ad4e;
            color: #fff;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            white-space: nowrap;
            margin-bottom: 2px;
            width: fit-content;
        }

        .member-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 4px;
            width: 100%;
        }

        .action-btn {
            border: none;
            border-radius: 6px;
            padding: 4px 12px;
            font-size: 12px;
            cursor: pointer;
            color: #fff;
            margin-right: 5px;
            transition: 0.2s;
        }

        .btn-primary {
            background: #0078d7;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-info {
            background: #6c757d;
        }

        .empty-state {
            text-align: center;
            color: #86909c;
            padding: 20px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

            .modal-overlay.show {
                display: flex;
            }

        .modal-box {
            background: #fff;
            border-radius: 14px;
            padding: 25px;
            width: 400px;
            max-width: 90vw;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            background: none;
            border: none;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 20px;
        }

            .profile-header img {
                width: 70px;
                height: 70px;
                border-radius: 50%;
                object-fit: cover;
                margin-bottom: 10px;
            }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

            .profile-grid label {
                font-size: 13px;
                color: #666;
            }

            .profile-grid span {
                font-size: 15px;
                color: #333;
            }

        .brief-profile-box {
            text-align: center;
        }

        .brief-profile-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .brief-field {
            margin: 8px 0;
            font-size: 14px;
        }

            .brief-field strong {
                color: #333;
            }

        .toast {
            position: fixed;
            top: 30px;
            right: 30px;
            padding: 14px 24px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            z-index: 9999;
            animation: slideIn 0.4s ease;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
            pointer-events: none;
        }

        .toast-success {
            background: #28a745;
        }

        .toast-error {
            background: #dc3545;
        }

        .toast-info {
            background: #0078d4;
        }

        .toast-hidden {
            opacity: 0;
            transition: opacity 0.4s;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .self-tag {
            display: inline-block;
            background: #0078d7;
            color: #fff;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            white-space: nowrap;
            margin-left: 6px;
            width: fit-content;
        }
    </style>
</head>
<body>

<div class="chat-list">
    <div class="chat-list-header">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <span>聊天</span>
    </div>
    <div class="session-list" id="session-list"></div>
</div>

<div class="chat-area">
    <div class="chat-header">
        <div class="chat-header-avatar" id="chat-avatar">●</div>
        <div class="chat-header-name" id="chat-name">选择聊天</div>
    </div>
    <div class="chat-container" id="chat-container"></div>
    <div class="input-toolbar">
        <span class="tool-btn" onclick="document.getElementById('imgUpload').click()">🖼️</span>
        <span class="tool-btn" onclick="document.getElementById('videoUpload').click()">🎬</span>
        <input type="file" id="imgUpload" hidden multiple>
        <input type="file" id="videoUpload" hidden multiple>
    </div>
    <div class="input-area">
        <textarea id="message-input" placeholder="输入消息..." oninput="autoResize()"></textarea>
        <button id="send-btn" onclick="sendMessage()" disabled>发送</button>
    </div>
</div>

<div class="member-list" id="memberListPanel">
    <div class="member-list-header" id="member-list-title">成员 (0)</div>
    <div class="member-list-container" id="member-list-container"></div>
</div>

<div id="briefProfileModal" class="modal-overlay">
    <div class="modal-box" style="width:300px;">
        <button class="close-btn" onclick="document.getElementById('briefProfileModal').classList.remove('show')">×</button>
        <div class="brief-profile-box">
            <img id="briefAvatar" class="brief-profile-avatar" src="">
            <h4 id="briefName"></h4>
            <div class="brief-field"><strong>常玩游戏：</strong><span id="briefGame"></span></div>
            <div class="brief-field"><strong>匹配需求：</strong><span id="briefNeed"></span></div>
        </div>
    </div>
</div>

<div id="profileModal" class="modal-overlay">
    <div class="modal-box">
        <button class="close-btn" onclick="document.getElementById('profileModal').classList.remove('show')">×</button>
        <div class="profile-header">
            <img id="profileAvatar" src="">
            <h3 id="profileName"></h3>
            <p style="color:#666;font-size:13px;" id="profileIntro"></p>
        </div>
        <div class="profile-grid" id="profileGrid"></div>
    </div>
</div>

<div id="applyModal" class="modal-overlay">
    <div class="modal-box" style="width:350px;">
        <h4 style="margin-bottom:15px;">发送好友申请</h4>
        <p style="font-size:14px;margin-bottom:10px;">向 <strong id="applyTargetName"></strong> 发送申请：</p>
        <textarea id="applyReason" placeholder="请输入申请原因（选填）" style="width:100%;height:80px;padding:10px;border:1px solid #ddd;border-radius:8px;resize:vertical;"></textarea>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:15px;">
            <button class="action-btn" style="background:#ddd;color:#333;" onclick="document.getElementById('applyModal').classList.remove('show')">取消</button>
            <button class="action-btn btn-primary" onclick="confirmApply()">发送</button>
        </div>
    </div>
</div>

<div id="globalConfirmModal" class="modal-overlay">
    <div class="modal-box" style="width:300px;text-align:center;">
        <p id="globalConfirmMsg"></p>
        <div style="margin-top:20px;display:flex;justify-content:center;gap:10px;">
            <button class="action-btn" style="background:#ddd;color:#333;" onclick="closeGlobalConfirm()">取消</button>
            <button class="action-btn btn-danger" id="globalConfirmOk">确定</button>
        </div>
    </div>
</div>

<script>
    let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
    if (!currentUser || !currentUser.user_id) {
        alert('请先登录');
        location.href = 'login.html';
    }
    let currentSessionId = null,
        currentSessionType = null,
        sessionList = [];
    let currentLeaderId = null;

    function showToast(msg, type = 'info') {
        const t = document.createElement('div');
        t.className = 'toast toast-' + type;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => {
            t.classList.add('toast-hidden');
            setTimeout(() => t.remove(), 400);
        }, 2500);
    }

    function showConfirm(msg, cb) {
        document.getElementById('globalConfirmMsg').innerText = msg;
        document.getElementById('globalConfirmModal').classList.add('show');
        const ok = document.getElementById('globalConfirmOk');
        const clone = ok.cloneNode(true);
        ok.parentNode.replaceChild(clone, ok);
        clone.addEventListener('click', () => {
            document.getElementById('globalConfirmModal').classList.remove('show');
            cb();
        });
    }

    function closeGlobalConfirm() {
        document.getElementById('globalConfirmModal').classList.remove('show');
    }

    let pendingToUserId = null;
    function showApplyDialog(toUserId, nick) {
        pendingToUserId = toUserId;
        document.getElementById('applyTargetName').innerText = nick || `用户 ${toUserId}`;
        document.getElementById('applyReason').value = '';
        document.getElementById('applyModal').classList.add('show');
    }
    async function confirmApply() {
        const reason = document.getElementById('applyReason').value.trim();
        document.getElementById('applyModal').classList.remove('show');
        if (!pendingToUserId) return;
        try {
            const res = await fetch(`http://localhost:8081/friend/apply?fromUserId=${currentUser.user_id}&toUserId=${pendingToUserId}&reason=${encodeURIComponent(reason)}`, { method: 'POST' });
            const data = await res.json();
            showToast(data.code === 200 ? '申请已发送' : (data.msg || '失败'), data.code === 200 ? 'success' : 'error');
        } catch (e) { showToast('网络错误', 'error'); }
    }

    async function viewProfile(userId) {
        try {
            const infoRes = await fetch(`http://localhost:8081/user/info?userId=${userId}`);
            const infoData = await infoRes.json();
            if (!infoData.data) return showToast('获取失败', 'error');
            const u = infoData.data;
            document.getElementById('profileAvatar').src = u.avatar ? (u.avatar.startsWith('http') ? u.avatar : 'http://localhost:8081' + u.avatar) : 'https://ui-avatars.com/api/?name=' + encodeURIComponent(u.nick || u.username || '用户');
            document.getElementById('profileName').innerText = u.nick || u.username;
            document.getElementById('profileIntro').innerText = u.introduction || '无简介';
            document.getElementById('profileGrid').innerHTML = `
                <div><label>性别</label><span>${u.gender == 1 ? '男' : (u.gender == 0 ? '女' : '未知')}</span></div>
                <div><label>年龄</label><span>${u.age || '未填写'}</span></div>
                <div><label>常玩游戏</label><span>${u.game_name || '未设定'}</span></div>
                <div><label>性格</label><span>${u.personality || '未设定'}</span></div>
                <div><label>游玩时段</label><span>${u.playtime || '未设定'}</span></div>
                <div><label>匹配需求</label><span>${u.matchneed || '无'}</span></div>
                <div><label>联系方式</label><span>${u.contact || '未填写'}</span></div>
            `;
            document.getElementById('profileModal').classList.add('show');
        } catch (e) { showToast('加载失败', 'error'); }
    }

    async function viewBriefProfile(userId) {
        try {
            const res = await fetch(`http://localhost:8081/user/publicInfo?userId=${userId}`);
            const data = await res.json();
            if (data.code === 200) {
                document.getElementById('briefAvatar').src = data.avatar ? (data.avatar.startsWith('http') ? data.avatar : 'http://localhost:8081' + data.avatar) : 'https://ui-avatars.com/api/?name=' + encodeURIComponent(data.nick || '用户');
                document.getElementById('briefName').innerText = data.nick || '用户';
                document.getElementById('briefGame').innerText = data.gameName || '未设定';
                document.getElementById('briefNeed').innerText = data.matchNeed || '无';
                document.getElementById('briefProfileModal').classList.add('show');
            }
        } catch (e) { showToast('加载失败', 'error'); }
    }

// 正确匹配你后端的删除好友接口
async function deleteFriend(friendId) {
    showConfirm('确定删除该好友吗？', async () => {
        try {
            const res = await fetch(`http://localhost:8081/friend/delete?userId=${currentUser.user_id}&friendId=${friendId}`, {
                method: "DELETE",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                }
            });
            const r = await res.json();
            showToast(r.msg || "删除成功", r.code === 200 ? "success" : "error");

            if (currentSessionType === 'team') {
                loadTeamMembers(currentSessionId);
            } else {
                loadPrivateMembers(currentSessionId);
            }
        } catch (e) {
            showToast("删除失败", "error");
        }
    });
}

    async function fetchFriendIdSet() {
        const friendIds = new Set();
        try {
            const res = await fetch(`http://localhost:8081/friend/list?userId=${currentUser.user_id}`);
            const data = await res.json();
            if (data.code === 200 && data.data && Array.isArray(data.data)) {
                data.data.forEach(f => {
                    const fid = f.userId || f.user_id || f.friendId || f.friend_id || f.id;
                    if (fid) friendIds.add(Number(fid));
                });
            }
        } catch (e) { console.warn('获取好友列表失败'); }
        return friendIds;
    }

    async function loadAiHistory() {
        const chat = document.getElementById('chat-container');
        chat.innerHTML = '';
        try {
            const res = await fetch(`http://localhost:8081/ai/history?userId=${currentUser.user_id}`);
            const data = await res.json();
            if (data.code === 200 && data.data) {
                data.data.forEach(record => {
                    const myAvatar = currentUser.avatar
                        ? (currentUser.avatar.startsWith('http') ? currentUser.avatar : 'http://localhost:8081' + currentUser.avatar)
                        : '';

                    chat.insertAdjacentHTML('beforeend', `
                        <div class="message self">
                            <div class="message-avatar" style="background-image:url(${myAvatar}); background-size:cover;"></div>
                            <div class="message-content-wrap">
                                <div class="message-sender">我</div>
                                <div class="message-bubble">${record.userMsg}</div>
                            </div>
                        </div>
                    `);
                    chat.insertAdjacentHTML('beforeend', `
                        <div class="message other">
                            <div class="message-avatar" style="background:#13BBB1;display:flex;align-items:center;justify-content:center;">🤖</div>
                            <div class="message-content-wrap">
                                <div class="message-sender">AI智能助手</div>
                                <div class="message-bubble">${record.aiReply}</div>
                            </div>
                        </div>
                    `);
                });
                chat.scrollTop = chat.scrollHeight;
            }
        } catch (e) { }
    }

    async function loadAllSessions() {
        let list = [];
        list.unshift({ sessionId: 0, sessionType: "ai", name: "AI智能助手", avatar: "", lastMsg: "有什么可以帮你？" });

        try {
            const teamRes = await fetch(`http://localhost:8081/chat/team/list?userId=${currentUser.user_id}`);
            const teamData = await teamRes.json();
            if (teamData.code === 200) list = list.concat(teamData.data);

            const privateRes = await fetch(`http://localhost:8081/chat/private/my?userId=${currentUser.user_id}`);
            const privateData = await privateRes.json();
            if (privateData.code === 200) list = list.concat(privateData.data);
        } catch (e) { }
        sessionList = list;
        renderSessionList();
    }

    function renderSessionList() {
        const el = document.getElementById('session-list');
        el.innerHTML = '';
        sessionList.forEach(s => {
            const item = document.createElement('div');
            item.className = 'session-item';
            item.onclick = () => selectSession(s);

            let avatarStyle = '';
            let aiIcon = '';
            if (s.sessionType === 'ai') {
                avatarStyle = 'background:#13BBB1;display:flex;align-items:center;justify-content:center;';
                aiIcon = '🤖';
            } else {
                avatarStyle = s.avatar
                    ? `background-image:url(http://localhost:8081${s.avatar});background-size:cover;`
                    : 'background:#0078d7';
            }

            item.innerHTML = `
                <div class="session-avatar" style="${avatarStyle}">${aiIcon}</div>
                <div class="session-info">
                    <div class="session-nickname">${s.name}</div>
                    <div class="session-last-msg">${s.lastMsg || '暂无消息'}</div>
                </div>`;
            el.appendChild(item);
        });
    }

    async function selectSession(s) {
        currentSessionId = s.sessionId;
        currentSessionType = s.sessionType;
        currentLeaderId = s.ownerId || null;

        const avatarEl = document.getElementById('chat-avatar');
        const memberPanel = document.getElementById('memberListPanel');
        document.getElementById('chat-name').innerText = s.name;

        // 先重置头像元素的所有样式
        avatarEl.style.background = '';       // 清除纯色背景
        avatarEl.style.backgroundImage = ''; // 清除背景图片
        avatarEl.innerText = '';             // 清除文字（🤖、队、友）
        avatarEl.style.backgroundSize = '';  // 清除背景尺寸

        if (s.sessionType === 'ai') {
            avatarEl.style.background = '#13BBB1';
            avatarEl.innerText = '🤖';
            memberPanel.style.display = 'none';
        } else if (s.sessionType === 'team') {
            if (s.avatar) {
                avatarEl.style.backgroundImage = `url(http://localhost:8081${s.avatar})`;
                avatarEl.style.backgroundSize = 'cover';
            } else {
                avatarEl.style.background = '#0078d7';  // 默认蓝色背景
            }
            avatarEl.innerText = s.avatar ? '' : '队';
            memberPanel.style.display = 'flex';
        } else {
            if (s.avatar) {
                avatarEl.style.backgroundImage = `url(http://localhost:8081${s.avatar})`;
                avatarEl.style.backgroundSize = 'cover';
            } else {
                avatarEl.style.background = '#0078d7';
            }
            avatarEl.innerText = s.avatar ? '' : '友';
            memberPanel.style.display = 'flex';
        }

        document.getElementById('chat-container').innerHTML = '<div class="empty-state">加载消息中...</div>';

        if (s.sessionType === 'ai') {
            await loadAiHistory();
        } else if (s.sessionType === 'team') {
            await loadTeamMembers(s.sessionId);
            await loadTeamMessage(s.sessionId);
        } else {
            await loadPrivateMembers(s.sessionId);
            await loadPrivateMessage(currentUser.user_id, s.sessionId);
        }
    }

    async function loadTeamMembers(teamId) {
        const container = document.getElementById("member-list-container");
        const title = document.getElementById("member-list-title");
        try {
            const leaderId = currentLeaderId;
            const isCurrentUserLeader = (currentUser.user_id == leaderId);
            const [memberRes, friendIdSet] = await Promise.all([
                fetch(`http://localhost:8081/chat/team/members?teamId=${teamId}`),
                fetchFriendIdSet()
            ]);
            const result = await memberRes.json();
            if (result.code !== 200 || !result.data) {
                title.innerText = "成员 (0)";
                container.innerHTML = `<div class="empty-state">暂无成员</div>`;
                return;
            }
            title.innerText = `成员 (${result.data.length})`;
            container.innerHTML = "";

            for (let u of result.data) {
                const isLeader = (u.user_id == leaderId);
                const isSelf = (u.user_id == currentUser.user_id);
                const isFriend = friendIdSet.has(Number(u.user_id));
                const div = document.createElement("div");
                div.className = "member-item";

                let buttonsHtml = '';
                if (!isSelf) {
                    if (isCurrentUserLeader && !isLeader) {
                        buttonsHtml += `<button class="member-btn member-btn-danger" onclick="removeMember(${teamId}, ${u.user_id})">移除</button>`;
                    }
                    if (!isFriend) {
                        buttonsHtml += `<button class="member-btn member-btn-primary" onclick="showApplyDialog(${u.user_id}, '${u.username || '用户'}')">加好友</button>`;
                    }
                }
                buttonsHtml += `<button class="member-btn member-btn-info" onclick="viewBriefProfile(${u.user_id})">资料</button>`;
                const nameHtml = `${u.username || '用户'}${isSelf ? '<span class="self-tag">我</span>' : ''}`;

                div.innerHTML = `
                    <div class="member-top">
                        <div class="member-avatar" style="background-image:url(${u.avatar ? 'http://localhost:8081' + u.avatar : ''}); background-size:cover;"></div>
                        <div class="member-name-wrap">
                            ${isLeader ? '<span class="leader-tag">队长</span>' : ''}
                            <span class="member-name">${nameHtml}</span>
                        </div>
                    </div>
                    <div class="member-actions">${buttonsHtml}</div>
                `;
                container.appendChild(div);
            }
        } catch (e) {
            title.innerText = "成员 (0)";
            container.innerHTML = `<div class="empty-state">加载失败</div>`;
        }
    }

    async function removeMember(teamId, userId) {
        showConfirm('确定将该成员移出队伍吗？', async () => {
            const res = await fetch(`http://localhost:8081/team/remove?teamId=${teamId}&leaderId=${currentUser.user_id}&userId=${userId}`, { method: 'POST' });
            const r = await res.json();
            showToast(r.msg, r.code === 200 ? 'success' : 'error');
            if (r.code === 200) loadTeamMembers(teamId);
        });
    }

    async function loadPrivateMembers(userId) {
        const container = document.getElementById('member-list-container');
        document.getElementById('member-list-title').innerText = '好友信息';
        try {
            const res = await fetch(`http://localhost:8081/user/publicInfo?userId=${userId}`);
            const data = await res.json();
            if (data.code === 200) {
                container.innerHTML = `
                    <div style="text-align:center;padding:15px;">
                        <img src="${data.avatar ? (data.avatar.startsWith('http') ? data.avatar : 'http://localhost:8081' + data.avatar) : 'https://ui-avatars.com/api/?name=User'}" style="width:60px;height:60px;border-radius:50%;object-fit:cover;">
                        <h4 style="margin:10px 0;">${data.nick}</h4>
                        <p style="font-size:13px;color:#666;">${data.introduction || '无简介'}</p>
                        <div style="margin-top:15px;display:flex;gap:8px;justify-content:center;">
                            <button class="action-btn btn-info" onclick="viewProfile(${userId})">详细资料</button>
                            <button class="action-btn btn-danger" onclick="deleteFriend(${userId})">删除好友</button>
                        </div>
                    </div>`;
            }
        } catch (e) { }
    }

    async function loadTeamMessage(teamId) {
        const chat = document.getElementById('chat-container');
        chat.innerHTML = '';
        const res = await fetch(`http://localhost:8081/chat/team/history?teamId=${teamId}`);
        const data = await res.json();
        if (data.code === 200 && data.data) {
            data.data.forEach(msg => chat.insertAdjacentHTML('beforeend', getMsgHtml(msg, msg.fromId == currentUser.user_id)));
            chat.scrollTop = chat.scrollHeight;
        }
    }

    async function loadPrivateMessage(uid1, uid2) {
        const chat = document.getElementById('chat-container');
        chat.innerHTML = '';
        const res = await fetch(`http://localhost:8081/chat/private/history?userId1=${uid1}&userId2=${uid2}`);
        const data = await res.json();
        if (data.code === 200 && data.data) {
            data.data.forEach(msg => chat.insertAdjacentHTML('beforeend', getMsgHtml(msg, msg.fromId == currentUser.user_id)));
            chat.scrollTop = chat.scrollHeight;
        }
    }

    function getMsgHtml(msg, isSelf) {
        let media = '';
        if (msg.msgType === 'image') media = `<img src="http://localhost:8081${msg.fileUrl}">`;
        else if (msg.msgType === 'video') media = `<video src="http://localhost:8081${msg.fileUrl}" controls></video>`;
        return `
            <div class="message ${isSelf ? 'self' : 'other'}">
                <div class="message-avatar" style="background-image:url(http://localhost:8081${msg.avatar})"></div>
                <div class="message-content-wrap">
                    <div class="message-sender">${isSelf ? '我' : msg.username}</div>
                    <div class="message-bubble">${msg.content || ''}${media}</div>
                </div>
            </div>`;
    }

    async function sendMessage() {
        const input = document.getElementById('message-input');
        const content = input.value.trim();
        
        // 修复AI会话判断
        if (!content || currentSessionId === null || currentSessionId === undefined) {
            return;
        }

        // AI 发送
        if (currentSessionType === 'ai') {
            try {
                const response = await fetch("http://localhost:8081/ai/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        userId: currentUser.user_id, 
                        msg: content 
                    })
                });

                if (!response.ok) {
                    throw new Error("接口异常");
                }

                await loadAiHistory();
                input.value = '';
                autoResize();
            } catch (e) {
                showToast('AI 消息发送失败', 'error');
                console.error(e);
            }
            return;
        }

        // 普通聊天
        const url = currentSessionType === 'team' ? 'http://localhost:8081/chat/team/send' : 'http://localhost:8081/chat/private/send';
        const params = new URLSearchParams();
        params.append('fromId', currentUser.user_id);
        params.append('content', content);
        params.append('msgType', 'text');
        if (currentSessionType === 'team') params.append('teamId', currentSessionId);
        else params.append('toUserId', currentSessionId);
        await fetch(url, { method: 'POST', body: params });
        input.value = '';
        autoResize();
        if (currentSessionType === 'team') loadTeamMessage(currentSessionId);
        else loadPrivateMessage(currentUser.user_id, currentSessionId);
    }

    async function sendMedia(file, type) {
        if (currentSessionType === 'ai') {
            showToast('AI不支持图片/视频', 'error');
            return;
        }
        if (!file || !currentSessionId) return;
        let fd = new FormData();
        fd.append('file', file);
        let upRes = await fetch('http://localhost:8081/file/upload', { method: 'POST', body: fd });
        let fileUrl = await upRes.text();
        if (!fileUrl.startsWith('/upload')) return showToast('上传失败', 'error');
        const url = currentSessionType === 'team' ? 'http://localhost:8081/chat/team/send' : 'http://localhost:8081/chat/private/send';
        const params = new URLSearchParams();
        params.append('fromId', currentUser.user_id);
        params.append('content', '');
        params.append('fileUrl', fileUrl);
        params.append('msgType', type);
        if (currentSessionType === 'team') params.append('teamId', currentSessionId);
        else params.append('toUserId', currentSessionId);
        await fetch(url, { method: 'POST', body: params });
        if (currentSessionType === 'team') loadTeamMessage(currentSessionId);
        else loadPrivateMessage(currentSessionId);
    }

    // 修复核心：解决AI sessionId=0 导致发送按钮禁用
    function autoResize() {
        const t = document.getElementById('message-input');
        const hasSession = currentSessionId !== null && currentSessionId !== undefined;
        document.getElementById('send-btn').disabled = !t.value.trim() || !hasSession;
    }

    window.onload = async () => {
        await loadAllSessions();
        document.getElementById('imgUpload').onchange = e => { for (let f of e.target.files) sendMedia(f, 'image'); };
        document.getElementById('videoUpload').onchange = e => { for (let f of e.target.files) sendMedia(f, 'video'); };
    };

    function goBack() { location.href = 'index.html'; }
</script>
</body>
</html>
