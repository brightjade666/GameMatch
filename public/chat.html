<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>队伍聊天</title>
    <style>
        :root {
            --primary: #0078d4;
            --bg: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部返回栏 */
        .top-bar {
            height: 50px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            flex-shrink: 0;
        }

        .back-btn {
            cursor: pointer;
            font-size: 20px;
            color: #333;
            text-decoration: none;
        }

        .top-bar h4 {
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        /* 主体布局 */
        .chat-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧队伍列表 */
        .chat-sidebar {
            width: 280px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .chat-search {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

            .chat-search input {
                width: 100%;
                padding: 10px 12px;
                border: 1px solid #ddd;
                border-radius: 20px;
                font-size: 14px;
                outline: none;
                background: #f5f5f5;
                transition: 0.3s;
            }

                .chat-search input:focus {
                    background: #fff;
                    border-color: var(--primary);
                }

        .chat-group-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-group-item {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

            .chat-group-item:hover {
                background: #f9f9f9;
            }

            .chat-group-item.active {
                background: #e3f2fd;
            }

        .chat-group-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #666;
            flex-shrink: 0;
        }

        .chat-group-info {
            flex: 1;
            min-width: 0;
        }

        .chat-group-name {
            font-weight: 600;
            font-size: 15px;
            color: #333;
        }

        .chat-group-meta {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }

        /* 右侧聊天区域 */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
        }

        .chat-header-bar {
            padding: 15px 20px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .chat-header-bar h2 {
                margin: 0;
                font-size: 18px;
                color: #333;
            }

            .chat-header-bar span {
                font-size: 13px;
                color: #999;
            }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-message {
            display: flex;
            gap: 12px;
            max-width: 70%;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-message.self {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .chat-message.other {
            align-self: flex-start;
        }

        .chat-message.self .msg-bubble {
            background: var(--primary);
            color: white;
        }

        .chat-message.other .msg-bubble {
            background: #fff;
            border: 1px solid #e0e0e0;
        }

        .chat-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #ddd;
        }

        .msg-content-wrap {
            flex: 1;
            min-width: 0;
        }

        .msg-sender {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
            padding-left: 4px;
        }

        .self .msg-sender {
            text-align: right;
            padding-right: 4px;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
        }

            .msg-bubble img {
                max-width: 200px;
                border-radius: 10px;
                cursor: pointer;
            }

        .chat-input-area {
            padding: 15px;
            background: #fff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #chat-image-btn {
            font-size: 28px;
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
            padding: 0 8px;
            transition: color 0.2s;
        }

            #chat-image-btn:hover {
                color: var(--primary);
            }

        #chat-text-input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }

            #chat-text-input:focus {
                border-color: var(--primary);
            }

        #chat-send-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 24px;
            background: #ccc;
            color: white;
            font-weight: 600;
            cursor: default;
            transition: background 0.3s;
        }

            #chat-send-btn.active {
                background: var(--primary);
                cursor: pointer;
            }

        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 30px;
            right: 30px;
            padding: 14px 24px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            z-index: 9999;
            animation: slideIn 0.4s ease;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
            pointer-events: none;
        }

        .toast-success {
            background: #28a745;
        }

        .toast-error {
            background: #dc3545;
        }

        .toast-info {
            background: #0078d4;
        }

        .toast-hidden {
            opacity: 0;
            transition: opacity 0.4s;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部返回栏 -->
    <div class="top-bar">
        <a href="index.html" class="back-btn">← 返回</a>
        <h4>队伍聊天</h4>
    </div>

    <div class="chat-wrapper">
        <!-- 左侧队伍列表 -->
        <div class="chat-sidebar">
            <div class="chat-search">
                <input type="text" id="chat-search-input" placeholder="搜索队伍...">
            </div>
            <div class="chat-group-list" id="chat-group-list"></div>
        </div>

        <!-- 右侧聊天区域 -->
        <div class="chat-main" id="chat-main-panel">
            <div class="chat-header-bar" id="chat-header-bar">
                <h2>选择一个队伍开始聊天</h2>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area">
                <button id="chat-image-btn" title="发送图片">+</button>
                <input type="text" id="chat-text-input" placeholder="输入消息...">
                <button id="chat-send-btn">发送</button>
                <input type="file" id="chat-image-input" accept="image/*" style="display:none">
            </div>
        </div>
    </div>

    <script>
        // Toast 提示函数
        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('toast-hidden');
                setTimeout(() => toast.remove(), 400);
            }, 2500);
        }

        // 登录检查（复用主页逻辑）
        function isLoggedIn() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            return user && user.user_id;
        }

        let currentChatGroupId = null;
        let chatGroupData = null;

        // 页面初始化
        window.onload = function () {
            if (!isLoggedIn()) {
                showToast('请先登录', 'error');
                setTimeout(() => { location.href = 'login.html'; }, 1500);
                return;
            }
            loadChatGroups();
            bindChatInput();
        };

        // 加载加入的队伍列表
        async function loadChatGroups() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            try {
                const res = await fetch(`http://localhost:8081/team/my/joined?userId=${user.user_id}`);
                const result = await res.json();
                const list = result.data || [];
                const container = document.getElementById('chat-group-list');
                const searchInput = document.getElementById('chat-search-input');

                function render(filter = '') {
                    const filtered = list.filter(team => team.teamName.toLowerCase().includes(filter.toLowerCase()));
                    container.innerHTML = filtered.map(team => `
                            <div class="chat-group-item ${currentChatGroupId === team.teamId ? 'active' : ''}"
                                 onclick="openChatRoom(${team.teamId})">
                                <div class="chat-group-avatar">${team.teamName[0]}</div>
                                <div class="chat-group-info">
                                    <div class="chat-group-name">${team.teamName}</div>
                                    <div class="chat-group-meta">${team.memberDetails ? team.memberDetails.length : 0} 人</div>
                                </div>
                            </div>
                        `).join('');
                }

                render();
                searchInput.oninput = () => render(searchInput.value);
            } catch (e) {
                console.error('加载聊天队伍失败', e);
                showToast('加载队伍失败', 'error');
            }
        }

        // 打开某个队伍的聊天室
        function openChatRoom(teamId) {
            if (!isLoggedIn()) return;
            currentChatGroupId = teamId;
            const user = JSON.parse(localStorage.getItem('currentUser'));

            fetch(`http://localhost:8081/team/my/joined?userId=${user.user_id}`)
                .then(r => r.json())
                .then(res => {
                    const team = (res.data || []).find(t => t.teamId == teamId);
                    if (!team) return showToast('队伍不存在', 'error');
                    chatGroupData = team;
                    document.getElementById('chat-header-bar').innerHTML = `
                            <h2>${team.teamName}</h2>
                            <span>队员 ${team.memberDetails ? team.memberDetails.length : 0} 人</span>
                        `;
                    renderChatMessages(teamId);
                    loadChatGroups(); // 刷新高亮
                });
        }

        // 聊天记录存储 key
        function getChatStorageKey(teamId) {
            return `chat_messages_${teamId}`;
        }

        function loadChatMessages(teamId) {
            const key = getChatStorageKey(teamId);
            return JSON.parse(localStorage.getItem(key) || '[]');
        }

        function saveChatMessages(teamId, messages) {
            const key = getChatStorageKey(teamId);
            localStorage.setItem(key, JSON.stringify(messages));
        }

        function renderChatMessages(teamId) {
            const container = document.getElementById('chat-messages');
            const messages = loadChatMessages(teamId);
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            let html = '';

            messages.forEach(msg => {
                const isSelf = msg.senderId === currentUser.user_id;
                const avatarSrc = msg.senderAvatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(msg.senderName);
                html += `
                        <div class="chat-message ${isSelf ? 'self' : 'other'}">
                            <img class="chat-avatar" src="${avatarSrc}" onerror="this.src='https://ui-avatars.com/api/?name=User'">
                            <div class="msg-content-wrap">
                                <div class="msg-sender">${msg.senderName}</div>
                                <div class="msg-bubble">
                                    ${msg.type === 'image'
                        ? `<img src="${msg.content}" onclick="window.open('${msg.content}')">`
                        : msg.content}
                                </div>
                            </div>
                        </div>`;
            });

            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        // 绑定输入与发送事件
        function bindChatInput() {
            const textInput = document.getElementById('chat-text-input');
            const sendBtn = document.getElementById('chat-send-btn');
            const imageBtn = document.getElementById('chat-image-btn');
            const imageInput = document.getElementById('chat-image-input');

            // 控制发送按钮颜色
            textInput.addEventListener('input', () => {
                if (textInput.value.trim()) {
                    sendBtn.classList.add('active');
                    sendBtn.style.cursor = 'pointer';
                } else {
                    sendBtn.classList.remove('active');
                    sendBtn.style.cursor = 'default';
                }
            });

            // 发送文字消息
            sendBtn.addEventListener('click', () => {
                if (!sendBtn.classList.contains('active') || !currentChatGroupId) return;
                sendChatMessage('text', textInput.value.trim());
                textInput.value = '';
                sendBtn.classList.remove('active');
                sendBtn.style.cursor = 'default';
            });

            // 回车发送
            textInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && sendBtn.classList.contains('active') && currentChatGroupId) {
                    sendBtn.click();
                }
            });

            // 发送图片
            imageBtn.addEventListener('click', () => imageInput.click());
            imageInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file || !currentChatGroupId) return;
                try {
                    let formData = new FormData();
                    formData.append('file', file);
                    const res = await fetch('http://localhost:8081/file/upload', { method: 'POST', body: formData });
                    const imgPath = await res.text();
                    sendChatMessage('image', imgPath);
                } catch (err) {
                    showToast('图片上传失败', 'error');
                }
                imageInput.value = '';
            });
        }

        // 往聊天记录中添加一条消息
        function sendChatMessage(type, content) {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const senderId = currentUser.user_id;
            const senderName = currentUser.nick || currentUser.username;
            const senderAvatar = currentUser.avatar ?
                (currentUser.avatar.startsWith('http') ? currentUser.avatar : 'http://localhost:8081' + currentUser.avatar)
                : '';

            const message = {
                senderId,
                senderName,
                senderAvatar,
                content,
                type,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            const messages = loadChatMessages(currentChatGroupId);
            messages.push(message);
            saveChatMessages(currentChatGroupId, messages);
            renderChatMessages(currentChatGroupId);
        }
    </script>
</body>
</html>
