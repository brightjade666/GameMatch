<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>欢迎登录 - 一起组队吧</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; height:100vh; background:#f4f7f9;">
    <div style="background:#fff; padding:40px; border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,0.1); width:350px;">
        <h2 id="auth-title" style="text-align:center;">用户登录</h2>
        <div id="reg-ext" style="display:none; text-align:center; margin-bottom:15px;">
            <img id="pre-avatar" src="https://via.placeholder.com/80" style="width:80px; height:80px; border-radius:50%; border:2px solid #eee; margin-bottom:10px; object-fit: cover;">
            <br>
            <input type="file" id="avatar-file" accept="image/*" onchange="handleAvatar(event)" style="font-size:12px;">
        </div>
        <input type="text" id="username" placeholder="输入账号/昵称" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:6px; box-sizing: border-box;">
        <input type="password" id="password" placeholder="输入密码" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:6px; box-sizing: border-box;">
        <button onclick="doAuth()" style="width:100%; background:var(--primary); color:white; border:none; padding:12px; border-radius:6px; cursor:pointer; font-size:16px; margin-top:10px;">确 定</button>
        <p style="text-align:center; font-size:14px; color:#666; margin-top:15px;">
            <span id="toggle-link" onclick="toggleAuth()" style="color:var(--primary); cursor:pointer;">没有账号？立即注册</span>
        </p>
    </div>

    <script>
        let mode = 'login';
        let avatarBase64 = "https://via.placeholder.com/80";

        function toggleAuth() {
            mode = (mode === 'login' ? 'reg' : 'login');
            document.getElementById('auth-title').innerText = mode === 'login' ? '用户登录' : '新用户注册';
            document.getElementById('reg-ext').style.display = mode === 'login' ? 'none' : 'block';
            document.getElementById('toggle-link').innerText = mode === 'login' ? '没有账号？立即注册' : '已有账号？返回登录';
        }

        function handleAvatar(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = () => {
                    avatarBase64 = reader.result;
                    document.getElementById('pre-avatar').src = avatarBase64;
                };
                reader.readAsDataURL(file);
            }
        }

        function doAuth() {
            const nickValue = document.getElementById('username').value;
            if (!nickValue) { alert("请输入昵称"); return; }
            const user = {
                nick: nickValue,
                avatar: avatarBase64,
                name: "未实名",
                bio: "这个人很懒，什么都没写~"
            };
            localStorage.setItem('currentUser', JSON.stringify(user));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
