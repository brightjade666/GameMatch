<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: url('https://picsum.photos/id/1039/1920/1080') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

            body::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
                z-index: 0;
            }

        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-title {
            text-align: center;
            color: white;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

            .input-group input {
                width: 100%;
                padding: 18px 20px 18px 50px;
                background: rgba(255, 255, 255, 0.9);
                border: 1px solid rgba(255, 255, 255, 0.3);
                border-radius: 30px;
                font-size: 15px;
                color: #333;
                outline: none;
                transition: all 0.3s ease;
            }

                .input-group input:focus {
                    background: white;
                    border-color: rgba(255, 255, 255, 0.5);
                    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
                }

            .input-group .icon {
                position: absolute;
                left: 18px;
                top: 50%;
                transform: translateY(-50%);
                font-size: 20px;
                color: #666;
            }

            .input-group .password-toggle {
                position: absolute;
                right: 18px;
                top: 50%;
                transform: translateY(-50%);
                font-size: 20px;
                color: #666;
                cursor: pointer;
                transition: color 0.3s ease;
                user-select: none;
            }

                .input-group .password-toggle:hover {
                    color: #333;
                }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0 30px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

            .remember input {
                width: 16px;
                height: 16px;
                cursor: pointer;
            }

        .forgot {
            color: white;
            font-size: 14px;
            text-decoration: none;
            transition: opacity 0.3s;
        }

            .forgot:hover {
                opacity: 0.8;
            }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

            .login-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            }

        .register-link {
            text-align: center;
            margin-top: 30px;
            color: white;
            font-size: 15px;
        }

            .register-link a {
                color: white;
                font-weight: 600;
                text-decoration: none;
                margin-left: 5px;
                transition: opacity 0.3s;
            }

                .register-link a:hover {
                    opacity: 0.8;
                }

        #register-form {
            display: none;
        }

            #register-form.active {
                display: block;
                animation: fadeIn 0.4s ease;
            }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .back-login {
            text-align: center;
            margin-top: 20px;
            color: white;
            font-size: 14px;
        }

            .back-login a {
                color: white;
                text-decoration: none;
                font-weight: 600;
            }

        .password-strength {
            margin-top: -12px;
            margin-bottom: 15px;
            height: 4px;
            background: #eee;
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .password-strength-text {
            font-size: 12px;
            color: white;
            text-align: right;
            margin-top: 2px;
        }
        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 30px;
            right: 30px;
            padding: 14px 24px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            z-index: 9999;
            animation: slideIn 0.4s ease;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
            pointer-events: none;
            max-width: 300px;
            word-break: break-word;
        }

        .toast-success {
            background: #28a745;
        }

        .toast-error {
            background: #dc3545;
        }

        .toast-info {
            background: #0078d4;
        }

        .toast-hidden {
            opacity: 0;
            transition: opacity 0.4s;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Toast 消息将由 JS 动态创建，移除原来的 message div -->
        <!-- 登录表单 -->
        <div id="login-form">
            <h1 class="page-title">欢迎回来</h1>
            <div class="input-group">
                <span class="icon">👤</span>
                <input type="text" id="login-name" placeholder="请输入用户名">
            </div>
            <div class="input-group">
                <span class="icon">🔒</span>
                <input type="password" id="login-pwd" placeholder="请输入密码">
                <span class="password-toggle" onclick="togglePassword('login-pwd', this)">👁️</span>
            </div>
            <div class="row">
                <label class="remember">
                    <input type="checkbox" id="remember-me">
                    <span>记住我</span>
                </label>
                <a href="#" class="forgot">忘记密码?</a>
            </div>
            <button class="login-btn" onclick="login()">登 录</button>
            <div class="register-link">
                还没有账号？<a href="javascript:switchTab('register')">立即注册</a>
            </div>
        </div>

        <!-- 注册表单 -->
        <div id="register-form">
            <h1 class="page-title">创建账号</h1>
            <div class="input-group">
                <span class="icon">👤</span>
                <input type="text" id="register-name" placeholder="设置用户名">
            </div>
            <div class="input-group">
                <span class="icon">🔒</span>
                <input type="password" id="register-pwd" placeholder="设置密码（8-20位，含数字和字符）" oninput="updatePasswordStrength()">
                <span class="password-toggle" onclick="togglePassword('register-pwd', this)">👁️</span>
            </div>
            <!-- 密码强度提示 -->
            <div class="password-strength">
                <div class="password-strength-bar" id="strength-bar"></div>
            </div>
            <div class="password-strength-text" id="strength-text"></div>

            <div class="input-group">
                <span class="icon">🔒</span>
                <input type="password" id="register-pwd-confirm" placeholder="确认密码">
                <span class="password-toggle" onclick="togglePassword('register-pwd-confirm', this)">👁️</span>
            </div>

            <button class="login-btn" onclick="register()">注 册</button>
            <div class="back-login">
                已有账号？<a href="javascript:switchTab('login')">返回登录</a>
            </div>
        </div>
    </div>

    <script>
        window.onload = function () {
            // 如果已登录且资料完整，直接进入首页
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUser && currentUser.user_id) {
                if (currentUser.nick && currentUser.nick.trim() !== '') {
                    location.href = 'index.html';
                } else {
                    location.href = 'user.html';
                }
            }
        };

        function switchTab(type) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            if (type === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                // 清空注册表单
                document.getElementById('register-name').value = '';
                document.getElementById('register-pwd').value = '';
                document.getElementById('register-pwd-confirm').value = '';
                updatePasswordStrength();
            }
        }

        // Toast 消息提示
        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('toast-hidden');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // 密码显示/隐藏切换
        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                iconElement.textContent = '🙈';
            } else {
                input.type = 'password';
                iconElement.textContent = '👁️';
            }
        }

        // 密码强度实时计算
        function updatePasswordStrength() {
            const pwd = document.getElementById('register-pwd').value;
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            let strength = 0;
            if (pwd.length >= 8) strength++;
            if (pwd.length >= 12) strength++;
            if (/\d/.test(pwd)) strength++;
            if (/[a-zA-Z]/.test(pwd)) strength++;
            if (/[^a-zA-Z0-9]/.test(pwd)) strength++;
            const percent = (strength / 5) * 100;
            bar.style.width = percent + '%';
            if (strength <= 2) {
                bar.style.background = '#dc3545';
                text.textContent = '弱';
                text.style.color = '#dc3545';
            } else if (strength <= 4) {
                bar.style.background = '#ffc107';
                text.textContent = '中';
                text.style.color = '#ffc107';
            } else {
                bar.style.background = '#28a745';
                text.textContent = '强';
                text.style.color = '#28a745';
            }
        }

        // 密码格式校验（一次返回所有问题）
        function validatePassword(password) {
            const errors = [];
            if (password.length < 8 || password.length > 20) {
                errors.push('密码长度需在8-20位之间');
            }
            const hasNumber = /\d/.test(password);
            const hasChar = /[a-zA-Z\W_]/.test(password); // 字母或特殊字符
            if (!hasNumber || !hasChar) {
                errors.push('密码必须同时包含数字和字符（字母/符号）');
            }
            return errors;
        }

        // 登录
        async function login() {
            const username = document.getElementById('login-name').value.trim();
            const password = document.getElementById('login-pwd').value.trim();

            if (!username || !password) {
                showToast('用户名和密码不能为空', 'error');
                return;
            }

            try {
                const response = await fetch("http://localhost:8081/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const result = await response.json();

                if (result.code === 200) {
                    showToast(result.msg, 'success');

                    const basicInfo = {
                        user_id: result.user_id,
                        username: result.username,
                        token: result.token
                    };
                    localStorage.setItem("currentUser", JSON.stringify(basicInfo));

                    try {
                        const infoRes = await fetch(`http://localhost:8081/user/info?userId=${result.user_id}`);
                        const infoData = await infoRes.json();
                        if (infoData.code === 200 && infoData.data) {
                            localStorage.setItem("currentUser", JSON.stringify(infoData.data));
                            const u = infoData.data;
                            const requiredFields = ['nick', 'age', 'game_name', 'personality', 'playtime', 'matchneed', 'contact'];
                            const incomplete = requiredFields.some(f => {
                                const val = u[f];
                                return !val || val === '' || val === 0;
                            });
                            if (incomplete) {
                                localStorage.setItem('needCompleteProfile', 'true');
                                setTimeout(() => { location.href = "user.html"; }, 1000);
                            } else {
                                localStorage.removeItem('needCompleteProfile');
                                setTimeout(() => { location.href = "index.html"; }, 1000);
                            }
                        } else {
                            localStorage.setItem('needCompleteProfile', 'true');
                            setTimeout(() => { location.href = "user.html"; }, 1000);
                        }
                    } catch (e) {
                        localStorage.setItem('needCompleteProfile', 'true');
                        setTimeout(() => { location.href = "user.html"; }, 1000);
                    }
                } else {
                    showToast(result.msg, 'error');
                }
            } catch (err) {
                showToast('服务器连接失败', 'error');
                console.error(err);
            }
        }

        // 注册
        async function register() {
            const username = document.getElementById('register-name').value.trim();
            const password = document.getElementById('register-pwd').value;
            const confirmPwd = document.getElementById('register-pwd-confirm').value;

            if (!username || !password) {
                showToast('用户名和密码不能为空', 'error');
                return;
            }

            // 一次性收集密码错误
            const pwdErrors = validatePassword(password);
            if (pwdErrors.length > 0) {
                showToast('密码要求：' + pwdErrors.join('；'), 'error');
                return;
            }

            // 确认密码对比
            if (password !== confirmPwd) {
                showToast('两次输入的密码不一致', 'error');
                return;
            }

            try {
                const response = await fetch("http://localhost:8081/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        contact: username
                    })
                });
                const result = await response.json();
                if (result.code === 200) {
                    showToast(result.msg, 'success');
                    switchTab('login');
                } else {
                    showToast(result.msg, 'error');
                }
            } catch (err) {
                showToast('注册失败：服务器连接失败', 'error');
                console.error(err);
            }
        }
    </script>
</body>
</html>
