<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ风格群聊系统（完整功能版）</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', 'Microsoft YaHei', sans-serif; }
        body {
            background: #f0f2f5;
            height:100vh; 
            display:flex; 
            overflow:hidden;
        }

        /* 左侧群列表区域 */
        .chat-list {
            width:280px; 
            background:white;
            border-right:1px solid #e5e6eb; 
            display:flex; 
            flex-direction:column;
        }
        .chat-list-header {
            padding:15px 20px; 
            font-size:18px; 
            font-weight:600; 
            border-bottom:1px solid #e5e6eb;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .chat-list-header .btn-group {
            display:flex;
            gap:8px;
        }
        .chat-list-header button {
            padding:6px 12px;
            background:#0084ff;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:14px;
        }
        .chat-list-header .logout-btn {
            background:#f53f3f;
        }
        .session-list {
            flex:1;
            overflow-y:auto;
        }
        .session-item {
            padding:12px 15px;
            border-bottom:1px solid #f0f2f5;
            cursor:pointer;
            display:flex;
            gap:12px;
            position:relative;
        }
        .session-item.active {
            background:#e5e6eb;
        }
        .session-item:hover {
            background:#f5f6f7;
        }
        .session-avatar {
            width:48px; 
            height:48px; 
            border-radius:50%; 
            background:#0084ff;
            display:flex; 
            align-items:center; 
            justify-content:center; 
            font-weight:600; 
            color:white;
            font-size:18px;
        }
        .session-info {
            flex:1;
            overflow:hidden;
        }
        .session-top {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:4px;
        }
        .session-nickname {
            font-size:16px;
            font-weight:500;
            color:#1d2129;
        }
        .session-time {
            font-size:12px;
            color:#86909c;
        }
        .session-last-msg {
            font-size:14px;
            color:#86909c;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        .unread-badge {
            position:absolute;
            right:15px;
            top:18px;
            width:20px;
            height:20px;
            background:#f53f3f;
            color:white;
            border-radius:50%;
            font-size:12px;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        /* 中间聊天区域 */
        .chat-area {
            flex:1; 
            display:flex; 
            flex-direction:column;
            background:#f7f8fa;
        }
        .chat-header {
            padding:12px 20px; 
            background:white;
            border-bottom:1px solid #e5e6eb; 
            display:flex; 
            align-items:center;
            justify-content:space-between;
        }
        .chat-header-left {
            display:flex;
            align-items:center;
            gap:12px;
        }
        .chat-header-avatar {
            width:40px;
            height:40px;
            border-radius:50%;
            background:#0084ff;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:16px;
        }
        .chat-header-name {
            font-size:16px;
            font-weight:500;
        }
        .chat-header-actions {
            display:flex;
            gap:8px;
        }
        .chat-header-actions button {
            padding:6px 12px;
            background:#f0f2f5;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:14px;
            color:#1d2129;
        }
        .chat-header-actions button:hover {
            background:#e5e6eb;
        }
        .chat-container {
            flex:1; 
            padding:20px; 
            overflow-y:auto; 
            display:flex; 
            flex-direction:column; 
            gap:15px;
        }
        .message {
            max-width:70%; 
            padding:10px 14px; 
            border-radius:12px; 
            animation:fadeIn 0.3s;
            position:relative;
        }
        @keyframes fadeIn { 
            from{opacity:0;transform:translateY(10px);} 
            to{opacity:1;transform:translateY(0);} 
        }
        .message.self { 
            align-self:flex-end; 
            background:#0084ff; 
            color:white;
            border-bottom-right-radius:4px;
        }
        .message.other { 
            align-self:flex-start; 
            background:white; 
            color:#1d2129;
            border-bottom-left-radius:4px;
            box-shadow:0 1px 2px rgba(0,0,0,0.1);
            display:flex;
            gap:8px;
        }
        .message-avatar {
            width:32px;
            height:32px;
            border-radius:50%;
            background:#86909c;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:12px;
            flex-shrink:0;
            margin-top:2px;
        }
        .message-content-wrap {
            flex:1;
        }
        .message-sender {
            font-size:12px;
            color:#86909c;
            margin-bottom:2px;
        }
        .message-content {
            font-size:15px;
            line-height:1.4;
        }
        .message-time {
            font-size:11px; 
            opacity:0.7; 
            position:absolute;
            bottom:4px;
            right:14px;
        }
        .message.other .message-time {
            left:14px;
            bottom:4px;
            right:auto;
        }
        .sending-status {
            align-self:flex-end;
            font-size:12px;
            color:#86909c;
            margin-right:10px;
        }

        /* 输入区域 */
        .input-area {
            padding:15px 20px; 
            background:white; 
            display:flex; 
            gap:10px; 
            border-top:1px solid #e5e6eb;
        }
        #message-input { 
            flex:1; 
            padding:12px 18px; 
            background:#f0f2f5;
            border:none; 
            border-radius:25px; 
            font-size:15px; 
            outline:none;
            resize:none;
            height:45px;
            max-height:120px;
        }
        #send-btn { 
            padding:12px 25px; 
            background:#0084ff; 
            border:none; 
            border-radius:25px; 
            color:white;
            font-weight:600; 
            cursor:pointer;
            font-size:15px;
        }
        #send-btn:disabled {
            background:#86909c;
            cursor:not-allowed;
        }

        /* 右侧群成员区域 */
        .member-list {
            width:240px;
            background:white;
            border-left:1px solid #e5e6eb;
            display:flex;
            flex-direction:column;
        }
        .member-list-header {
            padding:15px 20px; 
            font-size:16px; 
            font-weight:600; 
            border-bottom:1px solid #e5e6eb;
        }
        .member-list-container {
            flex:1;
            overflow-y:auto;
            padding:10px;
        }
        .member-item {
            padding:8px 12px;
            display:flex;
            align-items:center;
            gap:10px;
            border-radius:6px;
            margin-bottom:4px;
            cursor:pointer;
        }
        .member-item:hover {
            background:#f5f6f7;
        }
        .member-avatar {
            width:36px;
            height:36px;
            border-radius:50%;
            background:#0084ff;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:14px;
        }
        .member-name {
            font-size:14px;
            color:#1d2129;
        }
        .member-role {
            font-size:12px;
            color:white;
            background:#f53f3f;
            border-radius:4px;
            padding:1px 6px;
            margin-left:auto;
        }
        .member-role.admin {
            background:#0084ff;
        }

        /* 模态框样式 */
        .modal {
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.5);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:999;
            display:none;
        }
        .modal-content {
            background:white;
            border-radius:12px;
            padding:24px;
            width:90%;
            max-width:400px;
        }
        .modal-title {
            font-size:18px;
            font-weight:600;
            margin-bottom:20px;
            text-align:center;
        }
        .modal-form {
            display:flex;
            flex-direction:column;
            gap:16px;
        }
        .modal-form input {
            padding:12px 16px;
            border:1px solid #e5e6eb;
            border-radius:8px;
            font-size:15px;
        }
        .modal-form input:focus {
            outline:none;
            border-color:#0084ff;
        }
        .modal-btn-group {
            display:flex;
            gap:10px;
            margin-top:8px;
        }
        .modal-btn {
            flex:1;
            padding:12px;
            border:none;
            border-radius:8px;
            font-size:15px;
            cursor:pointer;
        }
        .modal-btn.primary {
            background:#0084ff;
            color:white;
        }
        .modal-btn.cancel {
            background:#f0f2f5;
            color:#1d2129;
        }

        /* 空状态提示 */
        .empty-state {
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            height:100%;
            color:#86909c;
            font-size:14px;
        }
        .empty-icon {
            font-size:48px;
            margin-bottom:16px;
            opacity:0.5;
        }
    </style>
</head>
<body>
    <!-- 左侧群列表 -->
    <div class="chat-list">
        <div class="chat-list-header">
            <span>群聊列表</span>
            <div class="btn-group">
                <button onclick="showCreateGroupModal()">创建群聊</button>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </div>
        <div class="session-list" id="session-list"></div>
    </div>

    <!-- 中间聊天区域 -->
    <div class="chat-area">
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="chat-header-avatar" id="chat-avatar">●</div>
                <div class="chat-header-name" id="chat-name">选择群聊开始聊天</div>
            </div>
            <div class="chat-header-actions">
                <button onclick="showAddMemberModal()">添加成员</button>
                <button onclick="showRemoveMemberModal()">移除成员</button>
                <button onclick="clearChatHistory()">清空记录</button>
            </div>
        </div>
        <div class="chat-container" id="chat-container">
            <div class="empty-state">
                <div class="empty-icon">💬</div>
                <div>选择一个群聊开始聊天吧</div>
            </div>
        </div>
        <div class="input-area">
            <textarea id="message-input" placeholder="输入消息..." oninput="autoResizeTextarea(this)"></textarea>
            <button id="send-btn" onclick="sendMessage()" disabled>发送</button>
        </div>
    </div>

    <!-- 右侧群成员列表 -->
    <div class="member-list">
        <div class="member-list-header" id="member-list-title">群成员 (0)</div>
        <div class="member-list-container" id="member-list-container">
            <div class="empty-state">
                <div class="empty-icon">👥</div>
                <div>暂无群成员</div>
            </div>
        </div>
    </div>

    <!-- 创建群聊模态框 -->
    <div class="modal" id="create-group-modal">
        <div class="modal-content">
            <div class="modal-title">创建新群聊</div>
            <div class="modal-form">
                <input type="text" id="group-name-input" placeholder="请输入群聊名称">
                <input type="text" id="group-avatar-input" placeholder="请输入群头像（单个字符/表情）" maxlength="1">
                <div class="modal-btn-group">
                    <button class="modal-btn primary" onclick="createGroup()">创建</button>
                    <button class="modal-btn cancel" onclick="closeAllModals()">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加成员模态框 -->
    <div class="modal" id="add-member-modal">
        <div class="modal-content">
            <div class="modal-title">添加群成员</div>
            <div class="modal-form">
                <input type="text" id="add-member-input" placeholder="请输入成员昵称">
                <div class="modal-btn-group">
                    <button class="modal-btn primary" onclick="addMember()">添加</button>
                    <button class="modal-btn cancel" onclick="closeAllModals()">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 移除成员模态框 -->
    <div class="modal" id="remove-member-modal">
        <div class="modal-content">
            <div class="modal-title">移除群成员</div>
            <div class="modal-form">
                <input type="text" id="remove-member-input" placeholder="请输入成员昵称">
                <div class="modal-btn-group">
                    <button class="modal-btn primary" onclick="removeMember()">移除</button>
                    <button class="modal-btn cancel" onclick="closeAllModals()">取消</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局状态
        let currentUser = null;
        let currentGroup = null;
        let isSending = false;
        // 新增：全局缓存DB数据，避免重复请求
        let globalDB = null;
        
        // 系统预设用户（可扩展）
        const systemUsers = [
            { nickname: 'admin', avatar: '👑', role: 'admin' },
            { nickname: 'AI助手', avatar: '🤖', role: 'member' },
            { nickname: '张三', avatar: '张', role: 'member' },
            { nickname: '李四', avatar: '李', role: 'member' },
            { nickname: '王五', avatar: '王', role: 'member' }
        ];

        // ========================= 本地存储/数据库交互 =========================
        // 初始化mock-db.json结构
        async function initMockDB() {
            const defaultDB = {
                users: systemUsers,
                groups: [
                    {
                        id: 'default_group',
                        name: '默认群聊',
                        avatar: '📢',
                        creator: 'admin',
                        members: ['admin', 'AI助手', '张三'],
                        messages: [],
                        unreadCount: 0,
                        lastMsg: '欢迎加入默认群聊！',
                        lastMsgTime: formatTime(new Date())
                    }
                ]
            };
            globalDB = defaultDB;
            return defaultDB;
        }

        // 读取mock-db.json（优先使用全局缓存）
        async function getMockDB() {
            if (globalDB) return globalDB;
            
            try {
                const res = await fetch('mock-db.json');
                if (!res.ok) throw new Error('文件不存在，初始化默认数据');
                const data = await res.json();
                globalDB = data;
                return data;
            } catch (e) {
                console.log('使用默认初始化数据:', e);
                return await initMockDB();
            }
        }

        // 保存数据到mock-db.json（关键修复：更新全局缓存 + 实际写入文件）
        async function saveMockDB(db) {
            globalDB = db;
            // 修复：模拟本地文件写入（前端环境下，实际项目需后端接口支持）
            // 1. 更新全局缓存
            // 2. 下载最新文件（保留原下载逻辑，同时更新缓存）
            const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'mock-db.json';
            a.click();
            URL.revokeObjectURL(a.href);
            
            // 额外：如果是Node.js/后端环境，可替换为文件系统写入
            // const fs = require('fs');
            // fs.writeFileSync('./mock-db.json', JSON.stringify(db, null, 2));
        }

        // ========================= AI聊天接口（保留你的配置） =========================
        async function callRealAI(content, groupId) {
            try {
                const response = await fetch("https://ark.cn-beijing.volces.com/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer b40245c1-3a87-43a2-ba78-f8781dd6c2f5"
                    },
                    body: JSON.stringify({
                        model: "doubao-seed-1-6-251015",
                        messages: [
                            { role: "system", content: "你是群聊中的AI助手，只允许使用纯文本聊天，禁止使用任何符号，只说人话，简短友好。" },
                            { role: "user", content: content }
                        ],
                        stream: false
                    })
                });
                const data = await response.json();
                let reply = "我在呢！有什么可以帮你的？";
                if (data.choices && data.choices.length > 0) {
                    reply = data.choices[0].message.content.replace(/[#*`\[\]\-=(){}|]/g, '').trim();
                }
                
                // 保存AI消息到群聊记录
                const aiMsg = {
                    sender: 'AI助手',
                    avatar: '🤖',
                    content: reply,
                    time: formatTime(new Date()),
                    type: 'other'
                };
                await saveMessageToGroup(groupId, aiMsg);
                
                return aiMsg;
            } catch (e) {
                console.error("AI调用失败:", e);
                const errMsg = {
                    sender: 'AI助手',
                    avatar: '🤖',
                    content: "抱歉，我暂时无法回复，请稍后再试！",
                    time: formatTime(new Date()),
                    type: 'other'
                };
                await saveMessageToGroup(groupId, errMsg);
                return errMsg;
            }
        }

        // ========================= 工具函数 =========================
        // 格式化时间
        function formatTime(date) {
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            return `${month}-${day} ${hours}:${minutes}`;
        }

        // 生成唯一ID
        function generateId() {
            return 'group_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        }

        // 关闭所有模态框
        function closeAllModals() {
            document.querySelectorAll('.modal').forEach(modal => {
                modal.style.display = 'none';
            });
            // 清空输入框
            document.getElementById('group-name-input').value = '';
            document.getElementById('group-avatar-input').value = '';
            document.getElementById('add-member-input').value = '';
            document.getElementById('remove-member-input').value = '';
        }

        // 显示指定模态框
        function showModal(modalId) {
            closeAllModals();
            document.getElementById(modalId).style.display = 'flex';
        }

        // 文本域自动高度
        function autoResizeTextarea(textarea) {
            textarea.style.height = '45px';
            if (textarea.scrollHeight > 45) {
                textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
            }
            // 禁用/启用发送按钮
            document.getElementById('send-btn').disabled = !textarea.value.trim() || !currentGroup;
        }

        // 滚动到聊天底部
        function scrollToChatBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        // ========================= 群聊核心功能 =========================
        // 页面初始化
        window.onload = async function () {
            // 验证登录状态（模拟登录：如果没有登录信息，默认用admin登录）
            const userStr = localStorage.getItem('userLogin');
            if (!userStr) {
                // 模拟登录：实际项目需跳转到login.html
                currentUser = { nickname: 'admin', avatar: '👑', role: 'admin' };
                localStorage.setItem('userLogin', JSON.stringify(currentUser));
                // location.href = 'login.html';
                // return;
            } else {
                currentUser = JSON.parse(userStr);
            }
            
            // 初始化群列表
            await renderGroupList();
            // 默认选中第一个群
            const db = await getMockDB();
            if (db.groups.length > 0) {
                await switchGroup(db.groups[0].id);
            }
            
            // 绑定输入事件
            bindInputEvents();
        };

        // 渲染群列表（修复：确保使用最新的DB数据）
        async function renderGroupList() {
            const db = await getMockDB();
            const sessionListEl = document.getElementById('session-list');
            sessionListEl.innerHTML = '';

            if (db.groups.length === 0) {
                sessionListEl.innerHTML = `
                    <div class="empty-state" style="padding:20px">
                        <div class="empty-icon">📁</div>
                        <div>暂无群聊，点击创建群聊</div>
                    </div>
                `;
                return;
            }

            db.groups.forEach(group => {
                const unreadBadge = group.unreadCount > 0 ? 
                    `<div class="unread-badge">${group.unreadCount}</div>` : '';
                
                const sessionItem = document.createElement('div');
                sessionItem.className = `session-item ${group.id === currentGroup ? 'active' : ''}`;
                sessionItem.onclick = () => switchGroup(group.id);
                sessionItem.innerHTML = `
                    <div class="session-avatar">${group.avatar}</div>
                    <div class="session-info">
                        <div class="session-top">
                            <div class="session-nickname">${group.name}</div>
                            <div class="session-time">${group.lastMsgTime}</div>
                        </div>
                        <div class="session-last-msg">${group.lastMsg}</div>
                    </div>
                    ${unreadBadge}
                `;
                sessionListEl.appendChild(sessionItem);
            });
        }

        // 切换群聊（修复：确保更新最新的成员列表和聊天记录）
        async function switchGroup(groupId) {
            const db = await getMockDB();
            const group = db.groups.find(g => g.id === groupId);
            if (!group) return;

            currentGroup = groupId;
            
            // 更新群聊头部信息
            document.getElementById('chat-avatar').innerText = group.avatar;
            document.getElementById('chat-name').innerText = group.name;
            
            // 重置未读消息数
            group.unreadCount = 0;
            await saveMockDB(db);
            await renderGroupList();
            
            // 渲染群成员列表
            await renderMemberList(group.members);
            
            // 渲染聊天记录
            await renderChatHistory(group.messages);
        }

        // 渲染群成员列表（修复：确保显示最新成员）
        async function renderMemberList(memberNicknames) {
            const db = await getMockDB();
            const memberListEl = document.getElementById('member-list-container');
            const memberTitleEl = document.getElementById('member-list-title');
            
            memberTitleEl.innerText = `群成员 (${memberNicknames.length})`;
            memberListEl.innerHTML = '';

            if (memberNicknames.length === 0) {
                memberListEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">👥</div>
                        <div>暂无群成员</div>
                    </div>
                `;
                return;
            }

            memberNicknames.forEach(nickname => {
                const user = db.users.find(u => u.nickname === nickname) || {
                    nickname: nickname,
                    avatar: nickname.charAt(0),
                    role: 'member'
                };
                
                const roleLabel = user.role === 'admin' ? 
                    '<div class="member-role admin">群主</div>' : 
                    (nickname === currentUser.nickname ? '<div class="member-role">我</div>' : '');
                
                const memberItem = document.createElement('div');
                memberItem.className = 'member-item';
                memberItem.innerHTML = `
                    <div class="member-avatar">${user.avatar}</div>
                    <div class="member-name">${user.nickname}</div>
                    ${roleLabel}
                `;
                memberListEl.appendChild(memberItem);
            });
        }

        // 渲染聊天记录（修复：确保显示所有历史消息）
        async function renderChatHistory(messages) {
            const chatContainer = document.getElementById('chat-container');
            
            if (messages.length === 0) {
                chatContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">💬</div>
                        <div>还没有聊天记录，发送第一条消息吧</div>
                    </div>
                `;
                return;
            }

            chatContainer.innerHTML = '';
            messages.forEach(msg => {
                renderSingleMessage(msg);
            });
            
            scrollToChatBottom();
        }

        // 渲染单条消息
        function renderSingleMessage(msg) {
            const chatContainer = document.getElementById('chat-container');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${msg.type}`;

            if (msg.type === 'other') {
                messageEl.innerHTML = `
                    <div class="message-avatar">${msg.avatar}</div>
                    <div class="message-content-wrap">
                        <div class="message-sender">${msg.sender}</div>
                        <div class="message-content">${msg.content}</div>
                        <div class="message-time">${msg.time}</div>
                    </div>
                `;
            } else {
                messageEl.innerHTML = `
                    <div class="message-content">${msg.content}</div>
                    <div class="message-time">${msg.time}</div>
                `;
            }

            chatContainer.appendChild(messageEl);
        }

        // 发送消息（修复：确保消息正确保存并更新UI）
        async function sendMessage() {
            const inputEl = document.getElementById('message-input');
            const content = inputEl.value.trim();
            
            if (!content || !currentGroup || isSending) return;

            isSending = true;
            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;
            sendBtn.innerText = "发送中...";

            // 构造用户消息
            const userMsg = {
                sender: currentUser.nickname,
                avatar: currentUser.avatar || currentUser.nickname.charAt(0),
                content: content,
                time: formatTime(new Date()),
                type: 'self'
            };

            // 渲染并保存消息
            renderSingleMessage(userMsg);
            await saveMessageToGroup(currentGroup, userMsg);
            
            // 清空输入框
            inputEl.value = '';
            inputEl.style.height = '45px';
            scrollToChatBottom();

            // 判断是否需要AI回复（群里有AI助手才回复）
            const db = await getMockDB();
            const group = db.groups.find(g => g.id === currentGroup);
            if (group.members.includes('AI助手')) {
                // 获取AI回复
                const aiMsg = await callRealAI(content, currentGroup);
                renderSingleMessage(aiMsg);
                scrollToChatBottom();
            }

            isSending = false;
            sendBtn.disabled = false;
            sendBtn.innerText = "发送";
        }

        // 保存消息到群聊（修复：确保更新全局DB并保存）
        async function saveMessageToGroup(groupId, msg) {
            const db = await getMockDB();
            const groupIndex = db.groups.findIndex(g => g.id === groupId);
            
            if (groupIndex === -1) return;

            // 添加消息到群
            db.groups[groupIndex].messages.push(msg);
            // 更新最后一条消息
            db.groups[groupIndex].lastMsg = msg.content.length > 20 ? 
                msg.content.substring(0, 20) + '...' : msg.content;
            db.groups[groupIndex].lastMsgTime = msg.time;

            // 增加未读消息数（当前未选中的群）
            if (groupId !== currentGroup) {
                db.groups[groupIndex].unreadCount += 1;
            }

            // 保存到数据库
            await saveMockDB(db);
            // 更新群列表
            await renderGroupList();
        }

        // 创建群聊（修复：确保新群聊正确显示）
        async function createGroup() {
            const groupName = document.getElementById('group-name-input').value.trim();
            const groupAvatar = document.getElementById('group-avatar-input').value.trim() || '📢';

            if (!groupName) {
                alert('请输入群聊名称！');
                return;
            }

            const db = await getMockDB();
            const newGroup = {
                id: generateId(),
                name: groupName,
                avatar: groupAvatar,
                creator: currentUser.nickname,
                members: [currentUser.nickname, 'AI助手'], // 默认添加创建者和AI助手
                messages: [],
                unreadCount: 0,
                lastMsg: '群聊已创建，开始聊天吧！',
                lastMsgTime: formatTime(new Date())
            };

            db.groups.push(newGroup);
            await saveMockDB(db);
            // 强制刷新群列表
            await renderGroupList();
            // 切换到新创建的群
            await switchGroup(newGroup.id);
            
            closeAllModals();
            alert('群聊创建成功！');
        }

        // 添加群成员（修复：确保成员添加后实时显示）
        async function addMember() {
            if (!currentGroup) {
                alert('请先选择一个群聊！');
                return;
            }

            const memberNickname = document.getElementById('add-member-input').value.trim();
            if (!memberNickname) {
                alert('请输入要添加的成员昵称！');
                return;
            }

            // 检查成员是否存在
            const db = await getMockDB();
            const userExists = db.users.some(u => u.nickname === memberNickname);
            if (!userExists) {
                alert(`成员「${memberNickname}」不存在！`);
                return;
            }

            const groupIndex = db.groups.findIndex(g => g.id === currentGroup);
            if (db.groups[groupIndex].members.includes(memberNickname)) {
                alert(`成员「${memberNickname}」已在群里！`);
                return;
            }

            // 添加成员
            db.groups[groupIndex].members.push(memberNickname);
            await saveMockDB(db);
            // 强制刷新成员列表
            await renderMemberList(db.groups[groupIndex].members);
            
            closeAllModals();
            alert(`成功添加成员「${memberNickname}」！`);
        }

        // 移除群成员（修复：确保成员移除后实时显示）
        async function removeMember() {
            if (!currentGroup) {
                alert('请先选择一个群聊！');
                return;
            }

            const memberNickname = document.getElementById('remove-member-input').value.trim();
            if (!memberNickname) {
                alert('请输入要移除的成员昵称！');
                return;
            }

            // 不能移除自己（群主）
            if (memberNickname === currentUser.nickname) {
                alert('不能移除自己！如需退出群聊，请使用解散群聊功能');
                return;
            }

            const db = await getMockDB();
            const groupIndex = db.groups.findIndex(g => g.id === currentGroup);
            const memberIndex = db.groups[groupIndex].members.findIndex(m => m === memberNickname);

            if (memberIndex === -1) {
                alert(`成员「${memberNickname}」不在群里！`);
                return;
            }

            // 移除成员
            db.groups[groupIndex].members.splice(memberIndex, 1);
            await saveMockDB(db);
            // 强制刷新成员列表
            await renderMemberList(db.groups[groupIndex].members);
            
            closeAllModals();
            alert(`成功移除成员「${memberNickname}」！`);
        }

        // 清空聊天记录（修复：确保记录清空后UI更新）
        async function clearChatHistory() {
            if (!currentGroup) {
                alert('请先选择一个群聊！');
                return;
            }

            if (!confirm('确定要清空当前群聊的所有聊天记录吗？此操作不可恢复！')) {
                return;
            }

            const db = await getMockDB();
            const groupIndex = db.groups.findIndex(g => g.id === currentGroup);
            
            db.groups[groupIndex].messages = [];
            db.groups[groupIndex].lastMsg = '聊天记录已清空';
            db.groups[groupIndex].lastMsgTime = formatTime(new Date());
            
            await saveMockDB(db);
            await renderChatHistory([]);
            
            alert('聊天记录已清空！');
        }

        // 绑定输入事件
        function bindInputEvents() {
            const inputEl = document.getElementById('message-input');
            inputEl.addEventListener('keydown', e => {
                // 回车发送（ctrl+回车换行）
                if (e.key === 'Enter' && !e.ctrlKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }

        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('userLogin');
                location.href = 'login.html';
            }
        }

        // 模态框显示函数
        function showCreateGroupModal() { showModal('create-group-modal'); }
        function showAddMemberModal() { 
            if (!currentGroup) {
                alert('请先选择一个群聊！');
                return;
            }
            showModal('add-member-modal'); 
        }
        function showRemoveMemberModal() { 
            if (!currentGroup) {
                alert('请先选择一个群聊！');
                return;
            }
            showModal('remove-member-modal'); 
        }
    </script>
</body>
</html>
